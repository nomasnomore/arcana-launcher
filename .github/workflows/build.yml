name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build APK
        run: bash ci-build.sh
      - name: Name the APK from the manifest version
        id: v
        run: echo "name=Arcana-$(grep -o 'versionName=\"[^\"]*\"' AndroidManifest.xml | cut -d'\"' -f2 | tr -d ' ()').apk" >> "$GITHUB_OUTPUT"
      - run: cp build/BlueHour.apk "${{ steps.v.outputs.name }}"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arcana-apk
          path: ${{ steps.v.outputs.name }}
          if-no-files-found: error

